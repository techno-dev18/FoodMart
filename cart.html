
<!DOCTYPE html>
<html lang="en">
<head>
  <title>FoodMart - Cart</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="cart.js"></script>
</head>

<body>

  <header class="header">

    <h1 class="logo">FoodMart</h1>

    <nav class="nav">

      <a href="index.html" class="nav-pill">
        Home
      </a>

      <a href="index.html#menuDisplay" class="nav-pill">
        Menu
      </a>

      <a href="cart.html" class="nav-pill active">
        Cart (<span id="cart-count">0</span>)
      </a>

    </nav>

  </header>


  <main class="cart-page">

    <h2 class="cart-title">
      Your Shopping Cart
    </h2>

    <section id="cartDisplay"></section>


    <section id="cart-summary">

      <div>
        <h3>
          Total Items:
          <span id="total-items">0</span>
        </h3>
      </div>

      <div>
        <h3>
          Total:
          ₹<span id="cart-total">0</span>
        </h3>
      </div>

      <div class="cart-buttons">

        <button
          id="clear-cart"
          class="product-button"
        >
          Clear Cart
        </button>

        <button
          id="checkout-btn"
          class="product-button"
        >
          Checkout
        </button>

      </div>

    </section>

  </main>

</body>
</html>
